name: Terraform Apply

# TEMPORARILY DISABLED — no Hetzner account yet.
# Restore push trigger when cloud provisioning is needed.
# Original trigger: push to main on infra/terraform/**
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    name: terraform apply
    runs-on: ubuntu-latest
    # environment: production creates a GitHub environment gate.
    # Configure required reviewers in Settings → Environments → production.
    environment: production

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      # Installs mise (pinned via version) and runs `mise install`, fetching the
      # exact toolchain from mise.toml — including terraform 1.15.8. Replaces
      # hashicorp/setup-terraform so CI and a developer resolve the same binaries
      # from one manifest (ADR-INFRA-017 §4).
      # Vendor: jdx (Jeff Dickey) — https://github.com/jdx/mise-action
      # Pinned: v4.2.4 @ full SHA (T3 GitHub Action, ADR-INFRA-012 §3).
      # Cooldown elapsed: 2026-08-01 → adopted 2026-08-24 (23 days ≥ 14, T3). Reviewed: 2026-08-24
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654  # v4.2.4
        with:
          version: 2026.8.8

      - name: Terraform Init
        env:
          TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
        run: mise run tf:init hetzner

      - name: Terraform Apply
        env:
          TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
          TF_VAR_ssh_key_name: ${{ secrets.HCLOUD_SSH_KEY_NAME }}
          TF_VAR_operator_cidr: ${{ secrets.OPERATOR_CIDR }}
          TF_CLI_ARGS_apply: "-auto-approve"
        run: mise run tf:apply hetzner
