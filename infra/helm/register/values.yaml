# register-server image, built from the risquanter/register repository and pushed
# to a registry the cluster pulls from. Full build → push → rollout loop:
# docs/IMAGE-DEPLOY.md.
#
# image.repository lives in the image-repo overlay, not here (independent of the cluster)
# (ADR-INFRA-014; IMAGE-DEPLOY.md § the image-repo axis):
#   values-localreg.yaml    k3d-registry.localhost:5000/register-server  (docker push)
#   values-ghcr.yaml  ghcr.io/risquanter/register-server           (CI push; ArgoCD
#                        Image Updater tracks the GHCR digest and commits the tag back)
# image.tag is the deploy lever — ArgoCD rolls the Deployment when it changes. The
# register repo's build.sbt `ThisBuild / version` is the source of truth; keep this
# tag in sync per deploy and use a fresh version tag each time (not a mutable "dev")
# so IfNotPresent pulls the new image and ArgoCD has a real diff to roll on.
image:
  tag: "0.4.0"
  pullPolicy: IfNotPresent

# Number of application replicas.
# Single-node cluster: 1 is sufficient. Increase when moving to multi-node.
replicaCount: 1

# Resource requests and limits.
# Requests: guaranteed allocation. Limits: hard ceiling.
# Tune based on observed usage (kubectl top pods -n register).
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

service:
  type: ClusterIP
  # API port — matches register.server.port in application.conf (REGISTER_SERVER_PORT)
  port: 8090
  # Dedicated kubelet health-probe port (REGISTER_HEALTH_PORT).
  # Both 8090 (API) and 8091 (probe) are STRICT mTLS. The kubelet probe on 8091
  # passes under STRICT via ztunnel + the 169.254.7.127/32 CiliumNetworkPolicy —
  # no PERMISSIVE exception. See peer-authentication.yaml and ADR-INFRA-004 §4.
  healthPort: 8091

# Ingress via Istio Gateway — configure host and TLS here.
ingress:
  enabled: false
  host: register.example.com
  tlsSecretName: register-tls

# Environment variables injected into the application container.
# Sensitive values should reference a Kubernetes Secret, not be set inline.
#
# DB_* variables are NOT included here. The register app currently uses
# Irmin for risk tree persistence (repositoryType=irmin) and in-memory
# for workspace metadata (TrieMap). When WorkspaceStorePostgres is
# implemented (enterprise persistence tier), add DB_* env vars here
# referencing a dedicated register-db-credentials Secret in the register
# namespace — NOT the postgres-credentials Secret in infra (that holds
# the superuser and Keycloak passwords). See ADR-INFRA-006.
env:
  # Auth mode: capability-only means no JWT/Keycloak required.
  - name: REGISTER_AUTH_MODE
    value: "capability-only"
  # Persistence: Irmin content-addressed backend for risk tree data.
  # The register app selects the repository implementation via this config.
  # Default in application.conf is "in-memory"; override to "irmin" for k8s.
  - name: REGISTER_REPOSITORY_TYPE
    value: "irmin"
  # Irmin URL: the irmin Service in the same namespace (register).
  - name: IRMIN_URL
    value: "http://irmin.register.svc.cluster.local:8080"
  # Startup readiness budget for the register→irmin dependency (register app
  # ADR-031, StartupReadiness.awaitReady). register and irmin are both wave 4,
  # gated behind mesh-policy at wave 3 — but ArgoCD's sync-wave only waits for
  # NetworkPolicy/AuthorizationPolicy objects to be Synced, not for the ambient
  # mesh dataplane (ztunnel) to finish programming them. That gap is the
  # register↔irmin startup race in docs/TODO.md Phase 3 / register NOTES.md.
  # 90s is a conservative initial estimate — 2x the app's in-app default (45s)
  # to cover full fresh-cluster bootstrap where ztunnel/istiod are themselves
  # still converging across many namespaces at once, not just a single-pod
  # steady-state restart. Not yet empirically measured against this cluster;
  # tune down once real reconcile latency is observed (see docs/TODO.md
  # Phase 3 "register↔irmin startup-ordering resilience").
  - name: IRMIN_HEALTHCHECK_BUDGET
    value: "90s"
  # SpiceDB fine-grained authorization backend (ADR-INFRA-010, TODO Step 2
  # §register-helm-values). Ignored while REGISTER_AUTH_MODE=capability-only;
  # consulted once the mode switches to fine-grained. HTTP in-cluster — the
  # ambient mesh (HBONE mTLS) provides encryption; MeshServiceUrl accepts http.
  - name: SPICEDB_URL
    value: "http://spicedb.infra.svc.cluster.local:8080"
  # Preshared key, from the register-namespace copy of the SpiceDB credential
  # (infra/secrets/spicedb-register.enc.yaml — applied manually like the other
  # SOPS secrets: sops --decrypt <file> | kubectl apply -f -).
  # NOT optional — if the secret is missing, the pod will not start. Apply the
  # secret to the cluster BEFORE syncing this chart.
  - name: SPICEDB_TOKEN
    valueFrom:
      secretKeyRef:
        name: spicedb-preshared-key-register
        key: spicedb-preshared-key

# imagePullSecrets: empty here (the local registry needs no auth). values-ghcr.yaml
# overrides this with the ghcr-pull secret for authenticated GHCR pulls.
imagePullSecrets: []

serviceAccount:
  name: register-runtime
