name: Terraform Plan

# TEMPORARILY DISABLED — no Hetzner account yet.
# Restore pull_request trigger when cloud provisioning is needed.
# Original trigger: pull_request on infra/terraform/**
on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write   # required to post the plan as a PR comment

jobs:
  plan:
    name: terraform plan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      # Installs mise (pinned via version) and runs `mise install`, fetching the
      # exact toolchain from mise.toml — including terraform 1.15.8. Replaces
      # hashicorp/setup-terraform so CI and a developer resolve the same binaries
      # from one manifest (ADR-INFRA-017 §4).
      # Vendor: jdx (Jeff Dickey) — https://github.com/jdx/mise-action
      # Pinned: v4.2.4 @ full SHA (T3 GitHub Action, ADR-INFRA-012 §3).
      # Cooldown elapsed: 2026-08-01 → adopted 2026-08-24 (23 days ≥ 14, T3). Reviewed: 2026-08-24
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654  # v4.2.4
        with:
          version: 2026.8.8

      - name: Terraform Init
        env:
          TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
        run: mise run tf:init hetzner

      - name: Terraform Validate
        run: mise run tf:validate hetzner

      - name: Terraform Plan
        id: plan
        env:
          TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
          TF_VAR_ssh_key_name: ${{ secrets.HCLOUD_SSH_KEY_NAME }}
          TF_VAR_operator_cidr: ${{ secrets.OPERATOR_CIDR }}
          TF_CLI_ARGS_plan: "-no-color"
        run: |
          mise run tf:plan hetzner 2>&1 | tee infra/terraform/envs/hetzner/plan.txt
          echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Post plan as PR comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7.1.0
        if: always()
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/terraform/envs/hetzner/plan.txt', 'utf8');
            const maxLen = 65000;
            const truncated = plan.length > maxLen
              ? plan.slice(0, maxLen) + '\n...(truncated)'
              : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan\n\`\`\`\n${truncated}\n\`\`\``
            });
