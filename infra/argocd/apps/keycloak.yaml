apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: argocd
  annotations:
    # Wave 3: platform service — needs PostgreSQL (wave 2).
    # Wave legend: see namespaces.yaml.
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: infra
  source:
    # Local Helm chart using the official upstream Keycloak image
    # (quay.io/keycloak/keycloak). Replaces the Bitnami chart whose
    # container images were removed from Docker Hub by Broadcom.
    repoURL: git@github.com:risquanter/register-infra.git
    path: infra/helm/keycloak
    targetRevision: HEAD
    helm:
      valueFiles:
        # Cluster axis (Keycloak has no image-repo choice — upstream quay.io image).
        # values-local carries the dev realm; swap in values-hetzner.yaml (prod
        # realm) for the Hetzner cluster (point 3). See IMAGE-DEPLOY.md for the
        # separate image-repo axis that the home-built charts use.
        - values.yaml
        - values-local.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: infra
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # infra namespace is created (with PSS labels + LimitRange) by the
      # namespaces app in wave 0 — never create here.
      - CreateNamespace=false
