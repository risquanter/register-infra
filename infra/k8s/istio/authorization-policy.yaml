apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: require-jwt
  namespace: register
spec:
  # targetRef scopes this policy to the waypoint proxy (L7), NOT to individual
  # pods via selector. This is the correct Istio Ambient pattern for HTTP-level
  # rules (JWT, paths).
  #
  # WHY NOT selector: {}
  # ztunnel operates at L4 and cannot evaluate HTTP attributes (requestPrincipals,
  # paths). When an ALLOW policy with only HTTP rules is attached to a pod via
  # selector, ztunnel silently omits all rules → the policy has zero effective
  # rules → any workload matched by the selector is in "deny by default" mode at
  # L4 → all east-west (pod-to-pod) TCP connections in the namespace are blocked.
  #
  # HOW THIS INTERACTS WITH SECURITY
  # With targetRef, ztunnel does not evaluate this policy. L4 enforcement is
  # provided by PeerAuthentication STRICT (mTLS required for all mesh traffic).
  # JWT and path enforcement run at the waypoint, which IS deployed (in every
  # environment, local included — `istioctl waypoint apply -n register
  # --enroll-namespace` during bootstrap; see ADR-INFRA-004 §Implementation).
  # All service-addressed traffic to register-namespace workloads traverses it,
  # so the rules below are live policy, not dormant scaffolding.
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: waypoint
  action: ALLOW
  rules:
    - # Authenticated routes: require a valid JWT (any principal).
      from:
        - source:
            # requestPrincipal is set only when a valid JWT was presented and
            # validated by the RequestAuthentication policy above.
            # An empty or missing JWT will have no principal → this rule does
            # not match → the request is denied (default deny when rules exist).
            requestPrincipals: ["*"]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-capability-urls
  namespace: register
spec:
  # Same targetRef pattern as require-jwt — waypoint-scoped, not pod-scoped.
  # Istio evaluates all ALLOW policies: a request is allowed when ANY policy
  # matches it. Public routes match here; authenticated routes match require-jwt.
  # No path is reachable by default without one of these policies matching.
  # ADR-INFRA-007 §3, ADR-021 (capability URL authorization model).
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: waypoint
  action: ALLOW
  rules:
    - # Public routes: no JWT required.
      # These paths are accessible without authentication — the capability URL
      # or the endpoint's nature (health probe) is the sole credential.
      # ADR-021 (capability URLs), AUTHORIZATION-PLAN L1.5 route matrix.
      to:
        - operation:
            paths:
              - "/w/*"                # Layer 0 capability routes (ADR-021)
              - "/workspaces"         # workspace bootstrap — EXACT path, see below
              - "/health"             # always public (route matrix row 1)
      # /workspaces is deliberately the EXACT path, not "/workspaces/*". The
      # bootstrap endpoint is `POST /workspaces` (WorkspaceLifecycleEndpoints
      # .scala — no trailing slash; "bootstrap" is only the endpoint's internal
      # name), and Istio reads "/workspaces/*" as prefix "/workspaces/", which
      # the shorter exact string never matches. No other route lives under
      # /workspaces, so the exact entry covers precisely the bootstrap call.
      #
      # WHY PUBLIC IN ALL AUTH MODES: in capability-only mode (Layer 0) the SPA
      # creates a workspace anonymously — no JWT exists, so the waypoint must
      # admit the request or the core L0 flow 403s at the front door. In
      # identity/fine-grained modes the app itself rejects unauthenticated
      # bootstrap (UserContextExtractor.requirePresent → x-user-id claim
      # required, Wave 6), so this entry does not weaken those modes: the
      # waypoint gate is path-level, the mode-aware identity gate is app-level,
      # and OPA ext_authz still evaluates every request (allow.rego treats
      # /workspaces as a Layer 0 public route, matching this policy).

---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: deny-admin-paths
  namespace: register
spec:
  # Same waypoint targetRef as the two ALLOW policies above, for the same
  # reason: ztunnel evaluates L4 only, so an HTTP rule attached by selector is
  # dropped and the policy denies nothing (ADR-INFRA-004 §3).
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: waypoint
  action: DENY
  rules:
    - to:
        - operation:
            paths:
              - "/admin"
              - "/admin/*"

# WHY A DENY POLICY IS NEEDED AT ALL
# Istio admits a request when ANY ALLOW policy matches it, so the two policies
# above cannot express "no path under /admin". They constrain different
# dimensions and each leaves the other free:
#   - require-jwt constrains identity and not path. requestPrincipals: ["*"]
#     matches any validated principal, and the rule carries no `to` clause, so
#     one valid token admits every path — /admin included.
#   - allow-capability-urls constrains path and not identity, and /admin is not
#     in its list.
# With no token, neither matches and the request is denied by default. With a
# token, require-jwt matches and the request is allowed. A DENY is evaluated
# before every ALLOW and holds in both cases, which is why it is the only rule
# that closes this path.
#
# WHAT IS BEHIND THE PATH
# One route: DELETE /admin/workspaces/expired, the on-demand equivalent of the
# TTL sweep the application's background reaper performs on its own schedule.
# Nothing else in the application serves a path under /admin — the cache
# administration routes are /risk-trees/{id}/cache/* and /cache/clear-all, and
# OPA gates those on the team_admin role.
#
# OPERATOR ACCESS IS RETAINED
# This policy is attached to the waypoint, which only sees service-addressed
# traffic. `kubectl port-forward` reaches the pod directly, so an operator with
# cluster access can still trigger the sweep; a caller arriving over the
# ingress cannot.
#
# WHY TWO PATH STRINGS
# Istio reads a trailing /* as prefix "/admin/", which never matches the exact
# string "/admin". Both entries are needed for the prefix and the bare path.
#
# WHY THIS IS NOT THE MISTAKE THE REMOVED POLICY MADE (see below)
# That policy matched request.headers[x-user-id], a header the jwt_authn filter
# re-adds from the validated token before the rbac filter runs, so it matched
# every authenticated request. A request's path is not rewritten between
# filters, so a path rule reads the same value the client sent.
#
# WHY NGINX IS NOT THE CONTROL
# The SPA server has no /admin location, so the path falls to its catch-all and
# the request never reaches the application. That holds only while nobody adds
# such a location, and it is a routing table rather than an authorization
# decision. This policy denies the path at the mesh, one hop before nginx.

# ── REMOVED: deny-forwarded-identity-headers ─────────────────────────────────
#
# A DENY AuthorizationPolicy that checked request.headers[x-user-id] was here
# previously. It was intended as defence-in-depth: block requests where x-user-id
# was pre-set by an external client.
#
# WHY IT WAS REMOVED: Envoy evaluates filters in this order:
#   1. HttpConnectionManager request_headers_to_remove  → strips x-user-id  ✅
#   2. jwt_authn (RequestAuthentication) → validates JWT, then
#      outputClaimToHeaders RE-ADDS x-user-id from the JWT sub claim
#   3. rbac (AuthorizationPolicy) → evaluates DENY policies first
#
# At step 3, x-user-id IS present (legitimately, from step 2). The DENY policy
# matched every authenticated request, returning 403 for all valid traffic.
# Public routes (no JWT → no outputClaimToHeaders → no x-user-id) were
# unaffected, making the bug hard to spot without end-to-end testing.
#
# HEADER STRIPPING IS STILL ENFORCED by the EnvoyFilter at
# infra/k8s/istio/envoy-filter-strip-headers.yaml. The EnvoyFilter operates at
# the HttpConnectionManager level (step 1), which runs before any HTTP filter.
# There is no known mechanism to bypass it in Envoy's architecture.
#
# Remaining defence-in-depth layers:
#   - EnvoyFilter strips external x-user-* headers           (L7 - waypoint)
#   - RequestAuthentication validates JWT, adds trusted headers (L7 - waypoint)
#   - PeerAuthentication STRICT rejects non-mesh traffic        (L4 - ztunnel)
#   - NetworkPolicy restricts ingress to app pods from waypoint (L3 - Cilium)
#
# See ADR-012 §5-§6, THREAT-CATALOG T3 (header forgery).
