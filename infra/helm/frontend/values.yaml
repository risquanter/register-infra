# Frontend image, built from the risquanter/register repository via compose (the
# service is profile-gated; build context is the PARENT dir — sibling repos
# hdr-rng/vague-quantifier-logic are copied in, see register TODO §5b):
#   docker compose --profile frontend build frontend
# then pushed to the registry the cluster pulls from. Full loop: docs/IMAGE-DEPLOY.md.
#
# image.repository lives in the image-repo overlay, not here (independent of the cluster)
# (ADR-INFRA-014; IMAGE-DEPLOY.md § the image-repo axis):
#   values-localreg.yaml    k3d-registry.localhost:5000/frontend  (docker push)
#   values-ghcr.yaml  ghcr.io/risquanter/frontend           (CI push / Image Updater)
image:
  tag: "0.4.0"
  pullPolicy: IfNotPresent

# Single replica is sufficient. The frontend is stateless (all state is in
# the backend). Scaling requires no coordination.
replicaCount: 1

# Resource requests and limits.
# nginx serving static files is extremely lightweight.
resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 64Mi

service:
  type: ClusterIP
  # nginx listens on 8080 (non-privileged port, uid 101).
  port: 8080

# Environment injected at container startup via the image entrypoint script.
# The nginx.conf is baked into the image; BACKEND_URL sets the proxy target
# for API calls (see ADR-027, Dockerfile.frontend-prod).
env:
  - name: BACKEND_URL
    value: "http://register.register.svc.cluster.local:8090"

# imagePullSecrets: empty here (the local registry needs no auth). values-ghcr.yaml
# overrides this with ghcr-pull for authenticated GHCR pulls. Same as the register chart.
imagePullSecrets: []

serviceAccount:
  name: frontend
