apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend
  namespace: argocd
  annotations:
    # Wave 4: app workload — runs after the platform (waves 0–3) is healthy.
    # Wave legend: see namespaces.yaml.
    argocd.argoproj.io/sync-wave: "4"
spec:
  # Frontend is application-level — the SPA server for the register UI.
  # It deploys into the register namespace with the register app.
  project: app
  source:
    repoURL: git@github.com:risquanter/register-infra.git
    targetRevision: HEAD
    path: infra/helm/frontend
    helm:
      releaseName: frontend
      valueFiles:
        # Image-repo axis (independent of cluster). Default is the local registry
        # (point 1); swap values-localreg.yaml → values-ghcr.yaml to pull from GHCR
        # (points 2 & 3, which also need the ghcr-pull secret). See IMAGE-DEPLOY.md.
        - values.yaml
        - values-localreg.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: register
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
