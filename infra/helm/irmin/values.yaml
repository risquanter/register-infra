# Irmin image — prod build from the risquanter/register repository:
#   docker build -f containers/prod/Dockerfile.irmin-prod \
#     -t k3d-registry.localhost:5000/irmin-prod:3.11-p1 .
# then pushed to the registry the cluster pulls from. Full loop: docs/IMAGE-DEPLOY.md.
#
# image.repository lives in the image-repo overlay, not here (independent of the cluster)
# (ADR-INFRA-014; IMAGE-DEPLOY.md § the image-repo axis):
#   values-localreg.yaml    k3d-registry.localhost:5000/irmin-prod  (docker push)
#   values-ghcr.yaml  ghcr.io/risquanter/irmin-prod           (CI push / Image Updater)
#
# Tag 3.11-p1 = upstream Irmin 3.11.0 plus the register repo's local irmin-graphql
# source patch. It is NOT interchangeable with upstream 3.11.0: upstream's
# merge_with_branch resolver discards the merge result and silently swallows merge
# conflicts; the patch propagates the conflict as a GraphQL error prefixed
# "merge conflict: ". The image built and pushed is 3.11-p1, so this tag must match
# it exactly — a bare "3.11" pulls a non-existent image (ImagePullBackOff). Source of
# truth for the tag and the patch: register's containers/builders/Dockerfile.irmin-builder
# and docs/dev/VERSION-UPGRADE-PROTOCOL.md (ADR-020 §11).
image:
  tag: "3.11-p1"
  pullPolicy: IfNotPresent

# Single replica is acceptable: Irmin is not fail-closed (unlike OPA).
# The register app degrades to read errors, not silent security failures.
# Increase when moving to multi-node or when write availability matters.
replicaCount: 1

# Resource requests and limits.
# Irmin is I/O-bound (content-addressed store reads/writes).
# The dev image is ~650 MB; tune memory based on tree working set size.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

service:
  type: ClusterIP
  port: 8080

# Irmin GraphQL server configuration.
irmin:
  # Data directory inside the container — persistent volume mounted here.
  dataDir: /data
  # GraphQL endpoint port (matches EXPOSE in Dockerfile).
  port: 8080
  # Git branch to serve (Irmin's main branch, not git repo branch).
  branch: main

# Persistent storage for Irmin's content-addressed pack files.
# Without this, all tree data is lost on pod restart.
persistence:
  enabled: true
  # StorageClass: use default (local-path on k3d, default on Hetzner).
  # Override for production if dedicated storage is needed.
  storageClass: ""
  size: 1Gi
  accessMode: ReadWriteOnce

# imagePullSecrets: empty here (the local registry needs no auth). values-ghcr.yaml
# overrides this with ghcr-pull for authenticated GHCR pulls. Same as the register chart.
imagePullSecrets: []

serviceAccount:
  name: irmin
